name: Verify and deploy Origin KSA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.9
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: python -m pytest -q
      - run: npm run check && npm run build
      - name: Install standalone verification tools
        run: npm ci --prefix scripts/qa --no-fund --no-audit
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Validate generated documents
        run: scripts/qa/node_modules/.bin/html-validate "dist/**/*.html"
      - name: Run browsers and accessibility checks
        run: AXE_PATH="$GITHUB_WORKSPACE/scripts/qa/node_modules/axe-core/axe.min.js" npm run test:browser
      - name: Audit mobile performance and accessibility
        run: |
          python3 scripts/serve.py &
          runner_pid=$!
          trap 'kill "$runner_pid"' EXIT
          LHCI_CHROME_PATH="$(which google-chrome)" scripts/qa/node_modules/.bin/lhci autorun --config=scripts/lighthouse.cjs
      - name: Check dependency advisories
        if: always()
        run: pnpm audit --audit-level low
      - name: Check verification tool advisories
        if: always()
        run: npm audit --prefix scripts/qa --audit-level low
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks
          path: |
            reports/browser-results.json
            .lighthouseci/local/*.json
          include-hidden-files: true
          retention-days: 3
      # Package the Pages artifact directly so its uploader is pinned too.
      - name: Archive GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'yes'
        run: tar --directory dist --exclude=.git --exclude=.github --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'yes'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'yes'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
